<!DOCTYPE html>
<html>
    <head>
        <title>Expense tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1 id="page-title">Daily Expense Tracker</h1>
                <p>Spend less, Save your Future!</p>
            </div>

            <hr>

            <div class="total-card">
                <h3>Total Expense of Today</h3>
                <h3 id="total-expense">0 rs</h3>
            </div>

            <hr>

            <div class = "form-sec">
                <fieldset>
                    <legend>New Expense</legend>

                    
                    <form id="expense-form">
                        <div class="form-group">
                            <label>Expense name :</label>
                            <input type = "text" required >
                            
                        </div>

                        <div class="form-group">
                            <label>Amount :</label>
                            <input type = "number" required>
                            
                        </div>

                        <div class="form-group">
                            <label>Category :</label>

                            <div class="form-options">
                                <label>
                                    <input type="radio" name="category">
                                    UPI
                                </label>

                                <label>
                                    <input type="radio" name="category">
                                    Cash
                                </label>

                                <label>
                                    <input type="radio" name="category">
                                    Card
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Date :</label>
                            <input type ="date" required>
                            
                        </div>

                        <button type="submit" id="add-expense-btn">
                            Add Expense
                        </button>

                    </form>
                </fieldset>
            </div>

            <hr>

            <div class="history-sec">
                <h3>History of Expense</h3>
                <table id="expense-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Name</th>
                            <th>Type</th>
                            <th>Amount</th>
                        </tr>
                    </thead>

                    <tbody>

                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
