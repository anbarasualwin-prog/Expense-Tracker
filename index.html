<!DOCTYPE html>
<html>
    <head>
        <title>Expense tracker</title>
    </head>
    <body>
        <div>
            <h1>Daily Expense Tracker</h1>
            <p>Spend less, Save your Future!</p>
        </div>
        <hr>
        <div>
            <h3>Total Expense of Today</h3>
            <h3>0 rs</h3>
        </div>
        <hr>
        <div>
            <fieldset>
                <legend>New Expense</legend>
                <br>
                <form>
                    <label>Expense name :</label>
                    <input type = "text" required >
                    <br><br>

                    <label>Amount :</label>
                    <input type = "number" required>
                    <br><br>

                    <label>Category :</label>
                    <label>UPI</label>
                    <input type = "radio" name="category">
                    <label>Cash</label>
                    <input type = "radio" name="category">
                    <label>Card</label>
                    <input type = "radio" name="category">
                    <br><br>

                    <label>Date :</label>
                    <input type ="date" required>
                    <br><br>

                    <button>Add Expense</button>

                </form>
            </fieldset>
        </div>
        <hr>
        <h3>History of Expense</h3>
        <table border="1">
            <thead>
                 <tr>
                    <th>Date</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Amount</th>
                </tr>
            </thead>

            <tbody>
            </tbody>
        </table>
    </body>
</html>
